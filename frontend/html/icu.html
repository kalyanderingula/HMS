<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HMS ICU & Critical Care</title>
  <link rel="stylesheet" href="/static/css/staff.css">
  <link rel="stylesheet" href="/static/css/icu.css?v=20261114-scrollfix">
  <script src="/static/js/icu.js?v=20261114-explicit-rbac" defer></script>
</head>
<body>
  <aside>
    <a class="brand" href="/">HMS <span>ICU & Critical Care</span></a>
    <nav><button class="active" data-view="dashboard">Live census</button><button data-view="beds">Units & beds</button></nav>
    <div class="session"><span id="user"></span><button id="logout">Sign out</button></div>
  </aside>
  <main>
    <header><div><p class="eyebrow">CRITICAL CARE OPERATIONS</p><h1>ICU Command Centre</h1></div><button id="refresh">Refresh</button></header>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="content" aria-busy="true">Loading ICU census…</section>
  </main>
  <dialog id="dialog"><form id="action-form"><header><h2 id="dialog-title"></h2><button type="button" id="close-dialog">×</button></header><div id="fields"></div><p id="form-error" role="alert"></p><button id="submit" type="submit">Save</button></form></dialog>
</body>
</html>
